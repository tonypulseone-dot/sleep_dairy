# Развёртывание одной командой: docker compose up -d
#
# Caddy сам получает сертификат Let's Encrypt — мини-приложение Telegram
# открывается только по https, и без сертификата кнопка молча не сработает.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: sleepdiary
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sleepdiary']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ['node', 'runtime/migrate.cjs']
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/sleepdiary
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/sleepdiary
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?задайте TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_APP_SHORT_NAME: ${TELEGRAM_APP_SHORT_NAME:-}
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_URL: https://${APP_DOMAIN:?задайте APP_DOMAIN}
      # Реквизиты для политики конфиденциальности. Без них страница /privacy
      # открывается с предупреждением, что документ не заполнен.
      LEGAL_OPERATOR: ${LEGAL_OPERATOR:-}
      LEGAL_INN: ${LEGAL_INN:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_HOSTING: ${LEGAL_HOSTING:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Бот включается профилем: COMPOSE_PROFILES=bot в .env. Установщик ставит
  # его, только если с сервера открывается api.telegram.org, — иначе бот
  # падал бы и перезапускался по кругу. Приложению бот не нужен.
  bot:
    build: .
    profiles: ['bot']
    restart: unless-stopped
    command: ['node', 'runtime/bot.cjs']
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      APP_URL: https://${APP_DOMAIN}
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сайты других сервисов на этом сервере — по файлу *.caddy на сайт.
      # После правки: scripts/caddy-reload.sh (проверит и перечитает).
      - ${CADDY_SITES_DIR:-/opt/caddy-sites}:/etc/caddy/sites:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:

# Имя сети закреплено: к ней подключаются другие сервисы на этом сервере
# (external: true), и оно не должно зависеть от названия папки проекта.
networks:
  default:
    name: sleep_dairy_default
